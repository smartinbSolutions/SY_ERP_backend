############################################
# HTTP → Redirect to HTTPS
############################################
server {
    listen 80;
    server_name erpsy.testapi.smartinb.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

############################################
# HTTPS → Reverse Proxy to Backend
############################################
server {
    listen 443 ssl;
    server_name erpsy.testapi.smartinb.com;

    # SSL Certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/erpsy.testapi.smartinb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erpsy.testapi.smartinb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ########################################
    # Backend 1 – port 8002 (default path)
    ########################################
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    ########################################
    # Backend 2 – port 8003 (optional)
    ########################################
    location /app2/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    ########################################
    # Backend 3 – port 8004 (optional)
    ########################################
    location /reports/ {
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}